@if (isOpen()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)" role="presentation"></div>
  <div
    class="modal-container"
    [class]="'modal-' + modalSize()"
    role="dialog"
    aria-modal="true"
    [aria-labelledby]="config()?.title ? 'modal-title' : null"
  >
    <div class="modal-content" #modalContent>
      <header class="modal-header">
        <h2 id="modal-title" class="modal-title">{{ config()?.title }}</h2>
        @if (config()?.showCloseButton !== false) {
          <button
            type="button"
            class="modal-close"
            (click)="close()"
            aria-label="Close modal"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        }
      </header>
      <div class="modal-body">
        @if (hasComponent()) {
          <ng-container [ngComponentOutlet]="componentType()!" [ngComponentOutletInputs]="componentData()" />
        }
      </div>
    </div>
  </div>
}
