<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MoviesWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function() {
      // Always set data-theme explicitly so [data-theme] selectors work.
      // Default is 'light' = gray theme; 'dark' is opt-in via toggle.
      var theme = 'light';
      try {
        if (localStorage.getItem('movie-crud-theme') === 'dark') {
          theme = 'dark';
        }
      } catch (e) {
        // Storage unavailable - keep default gray theme
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
