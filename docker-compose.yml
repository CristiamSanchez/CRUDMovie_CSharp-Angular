services:
  postgres:
    image: postgres:16-alpine
    container_name: movies-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies}
      POSTGRES_USER: ${POSTGRES_USER:-movies_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies_pass}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - movies_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movies_user} -d ${POSTGRES_DB:-movies}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  movies_data: